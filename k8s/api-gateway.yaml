apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0

          ports:
            - containerPort: 8090

          env:
            - name: AUTH_SERVICE_URL
              value: "https://auth-service:8443"

            - name: USER_SERVICE_URL
              value: "https://user-service:8443"

            - name: USER_ACTIVATION_SERVICE_URL
              value: "https://user-activation-service:8443"

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

---
apiVersion: v1
kind: Service

metadata:
  name: api-gateway

spec:
  selector:
    app: api-gateway

  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090

  type: NodePort